# Secret scanning of the full git history with gitleaks.
# Runs the gitleaks CLI from its official image pinned by digest (the gitleaks-action wrapper requires
# a paid licence for organisation repositories). Complements GitHub secret scanning / push protection.

name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * *" # daily: catches rules added upstream since the last push
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full history
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            -v "$GITHUB_WORKSPACE:/repo" \
            "$GITLEAKS_IMAGE" \
            git /repo \
              --config /repo/.github/gitleaks.toml \
              --redact \
              --no-banner \
              --exit-code 1 \
              --report-format sarif \
              --report-path /repo/gitleaks.sarif

      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != '' && vars.GHAS_ENABLED != 'false'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
