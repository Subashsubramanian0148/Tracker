# Continuous integration: quality gates, dependency audit, image build + scan + SBOM, IaC validation, DAST.
#
# All actions are pinned to full commit SHAs (tag in the trailing comment); Dependabot updates both.
# Mutable tags are not trusted: see the March 2026 trivy-action tag compromise (CVE-2026-33634).

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  RUNTIME_IMAGE: ado-metrics:ci
  MIGRATOR_IMAGE: ado-metrics-migrator:ci

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # `prisma generate` (part of the api typecheck) loads prisma.config.ts, which needs a URL. Never used to connect.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared contract package
        run: npm run build -w @ado-metrics/shared

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test API (with coverage)
        run: npm run test:cov -w @ado-metrics/api

      - name: Test web
        run: npm run test -w @ado-metrics/web

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/web/coverage
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Blocking: anything that ships in the runtime image.
      - name: npm audit (production dependencies, high+)
        run: npm audit --omit=dev --audit-level=high

      # Informational: the full tree including build/test tooling.
      - name: npm audit (all dependencies, report only)
        if: always()
        run: |
          npm audit --json > npm-audit-full.json || true
          npm audit || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit
          path: npm-audit-full.json
          retention-days: 14

  dependency-review:
    name: Dependency review
    # Needs the dependency graph (and GitHub Advanced Security on private repositories).
    if: github.event_name == 'pull_request' && vars.GHAS_ENABLED != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0-only, AGPL-3.0-or-later, GPL-3.0-only, GPL-3.0-or-later
          comment-summary-in-pr: never

  infra-validate:
    name: Validate Bicep and IaC
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compiles and lints without signing in to Azure (linter rules: infra/bicepconfig.json).
      - name: Bicep build + lint
        run: |
          az bicep install
          az bicep version
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep

      - name: Shell scripts syntax
        run: |
          shopt -s globstar nullglob
          for f in scripts/**/*.sh; do bash -n "$f"; done
          shellcheck --severity=warning scripts/**/*.sh

      - name: Trivy misconfiguration scan (Dockerfile, compose, workflows)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          skip-dirs: node_modules

  build-image:
    name: Build, scan, SBOM
    needs: [lint-typecheck-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          push: false
          tags: ${{ env.RUNTIME_IMAGE }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=ci-${{ github.run_number }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Build migrator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrator
          load: true
          push: false
          tags: ${{ env.MIGRATOR_IMAGE }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=ci-${{ github.run_number }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,scope=migrator,mode=max

      - name: Verify runtime image hardening
        run: |
          set -euo pipefail
          user=$(docker image inspect --format '{{.Config.User}}' "$RUNTIME_IMAGE")
          [ "$user" = "10001" ] || { echo "::error::runtime image must run as uid 10001 (got '$user')"; exit 1; }
          if docker run --rm --entrypoint sh "$RUNTIME_IMAGE" -c 'command -v npm || command -v npx || command -v curl || command -v wget'; then
            echo "::error::runtime image must not contain npm/npx/curl/wget"; exit 1
          fi
          if docker run --rm --entrypoint sh "$RUNTIME_IMAGE" -c 'ls -d /app/node_modules/prisma /app/node_modules/typescript /app/node_modules/jest /app/apps/api/src 2>/dev/null'; then
            echo "::error::runtime image must not contain build/test tooling or sources"; exit 1
          fi
          docker run --rm --read-only --tmpfs /tmp "$RUNTIME_IMAGE" node -e "require.resolve('@ado-metrics/shared', { paths: ['/app/apps/api'] }); require.resolve('@prisma/adapter-pg', { paths: ['/app/apps/api'] })"

      - name: SBOM (CycloneDX) - runtime
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.RUNTIME_IMAGE }}
          format: cyclonedx-json
          output-file: sbom-runtime.cdx.json
          upload-artifact: false

      - name: SBOM (CycloneDX) - migrator
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.MIGRATOR_IMAGE }}
          format: cyclonedx-json
          output-file: sbom-migrator.cdx.json
          upload-artifact: false

      - name: Upload SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom-*.cdx.json
          retention-days: 90

      - name: Trivy scan (SARIF report) - runtime
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.RUNTIME_IMAGE }}
          format: sarif
          output: trivy-runtime.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always() && vars.GHAS_ENABLED != 'false'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-runtime.sarif
          category: trivy-runtime

      - name: Trivy gate - runtime (fixable HIGH/CRITICAL fail the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.RUNTIME_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Trivy gate - migrator
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.MIGRATOR_IMAGE }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

      - name: Export images for DAST
        run: docker save "$RUNTIME_IMAGE" "$MIGRATOR_IMAGE" | gzip -1 > images.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images.tar.gz
          retention-days: 1

  dast:
    name: DAST (OWASP ZAP baseline)
    needs: [build-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images

      - name: Load images
        run: gunzip -c images.tar.gz | docker load

      - name: Create throwaway .env (dev auth, random secrets)
        run: scripts/ci/create-dast-env.sh .env

      - name: Start stack
        env:
          APP_IMAGE: ${{ env.RUNTIME_IMAGE }}
          MIGRATOR_IMAGE: ${{ env.MIGRATOR_IMAGE }}
        run: |
          docker compose up -d --no-build --wait --wait-timeout 180 app
          scripts/ci/wait-for-url.sh http://127.0.0.1:3000/api/health/ready 60

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          rules_file_name: .github/zap/rules.tsv
          # -a: include alpha passive rules; -j: AJAX spider for the SPA; -I: rules marked WARN do not fail
          # the job, only FAIL rules in rules.tsv do.
          cmd_options: -a -j -I
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-report

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --timestamps

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans
